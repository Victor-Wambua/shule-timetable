name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Sample solutions still pass the independent validator
        run: |
          uv run shule-timetable validate examples/secondary --solution examples/secondary/solution.json
          uv run shule-timetable validate examples/primary --solution examples/primary/solution.json
