[project]
name = "shule-timetable"
version = "0.1.0"
description = "Constraint-solver that builds clash-free school timetables from plain CSV/YAML and publishes printable class, teacher and room pages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Victor Wambua" }]
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.10",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]

[project.scripts]
shule-timetable = "shule_timetable.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shule_timetable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that solve a larger instance"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
